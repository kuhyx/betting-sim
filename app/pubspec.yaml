name: betting_sim
description: A sports-betting simulator with a fictional sport and fake money.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.13.0

dependencies:
  # One shared component layer; FitGrid keeps the main screens on one page.
  design_system:
    git:
      url: https://github.com/kuhyx/utils
      ref: design_system-v0.3.0
      path: design_system
  flutter:
    sdk: flutter
  league_engine:
    path: ../packages/league_engine
  # Exact pin, no caret: the freshness gate compares a pinned version against
  # the newest stable, and a range gives it nothing to compare.
  shared_preferences: 2.5.6

dev_dependencies:
  flutter_launcher_icons: 0.14.4
  flutter_test:
    sdk: flutter
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

# Regenerate the source art with:
#   PYTHONPATH=~/src/testsAndMisc python3 -m python_pkg.app_icons \
#     generate --app betting_sim --android
# The glyph and accent live in that shared generator, never here: one icon
# family across every app.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#211D1B"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  adaptive_icon_monochrome: "assets/icon/icon_monochrome.png"
  min_sdk_android: 21
