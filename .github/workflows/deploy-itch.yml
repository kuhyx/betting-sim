name: deploy-itch

# Auto-update https://kuhyx.itch.io/betting-sim (channel html5) whenever main
# changes. Runs after this repo's check workflows finish; deploys only when
# EVERY check on that commit is green (dependency-freshness, job "dependencies
# on newest stable", excepted: an upstream release overnight is not this
# commit's fault), and only if game
# files changed since the build that is live now. Build -> boot gate -> push.
# Secret: BUTLER_API_KEY (dedicated itch API key, revocable on its own).

on:
  workflow_run:
    workflows: [ci, md-naming]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: Deploy even if no game files changed (proves the push path)
        type: boolean
        default: false

# One deploy at a time; a newer commit's run waits, never interleaves.
concurrency:
  group: deploy-itch
  cancel-in-progress: false

permissions:
  contents: read
  checks: read
  actions: read

env:
  ITCH_TARGET: kuhyx/betting-sim:html5

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    # A healthy deploy takes ~5 min; a stalled one must not hold the queue.
    timeout-minutes: 25
    steps:
      - name: Every check on this commit green?
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          runs="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${SHA}/check-runs?per_page=100" \
            --jq '[.check_runs[] | select(.name != "deploy" and (.name | test("freshness|newest stable"; "i") | not))]')"
          pending="$(jq '[.[] | select(.status != "completed")] | length' <<<"$runs")"
          bad="$(jq '[.[] | select(.status == "completed" and (.conclusion | IN("success","skipped","neutral") | not))] | length' <<<"$runs")"
          echo "checks: $(jq length <<<"$runs") pending: $pending failing: $bad"
          if [[ "$bad" -gt 0 ]]; then echo "go=false" >>"$GITHUB_OUTPUT"; echo "::warning::not deploying: a check failed"; exit 0; fi
          if [[ "$pending" -gt 0 ]]; then echo "go=false" >>"$GITHUB_OUTPUT"; echo "waiting for the last workflow to finish"; exit 0; fi
          echo "go=true" >>"$GITHUB_OUTPUT"
          echo "sha=$SHA" >>"$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.gate.outputs.go == 'true'
        with:
          ref: ${{ steps.gate.outputs.sha }}
          fetch-depth: 0

      - name: Install butler
        if: steps.gate.outputs.go == 'true'
        run: |
          curl -fsSL -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip -d "$HOME/.butler" && rm butler.zip
          echo "$HOME/.butler" >>"$GITHUB_PATH"

      - name: Game files changed since the live build?
        if: steps.gate.outputs.go == 'true'
        id: changed
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          set -euo pipefail
          live="$(butler status "$ITCH_TARGET" | grep -oE '\| [0-9a-f]{7,} +\|' | tr -d '| ' | head -1 || true)"
          echo "live build: ${live:-none}"
          if [[ "${{ inputs.force }}" == "true" ]]; then echo "deploy=true" >>"$GITHUB_OUTPUT"; echo "forced"; exit 0; fi
          if [[ -n "$live" ]] && git cat-file -e "$live^{commit}" 2>/dev/null; then
            # Docs, markdown, CI and the Android target never reach itch players.
            if git diff --quiet "$live" HEAD -- . ':!*.md' ':!docs/**' ':!.github/**' ':!app/android/**'; then
              echo "deploy=false" >>"$GITHUB_OUTPUT"; echo "no game changes since $live"; exit 0
            fi
          fi
          echo "deploy=true" >>"$GITHUB_OUTPUT"

      # Same toolchain as ci.yml's "flutter app" job, which already builds and
      # boot-tests this exact bundle on every push.
      - uses: subosito/flutter-action@v2
        if: steps.gate.outputs.go == 'true' && steps.changed.outputs.deploy == 'true'
        with:
          channel: stable

      # publish_itch.sh runs the smoke test through uv and fetches Chromium
      # itself. No `--with-deps`: the runner image already ships Chrome's
      # system libraries, and the apt mirror once stalled that step for 15
      # minutes. setup-uv publishes no floating major tag; pin the release.
      - uses: astral-sh/setup-uv@v10.2.0
        if: steps.gate.outputs.go == 'true' && steps.changed.outputs.deploy == 'true'

      - name: Export, boot-test, push
        if: steps.gate.outputs.go == 'true' && steps.changed.outputs.deploy == 'true'
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: tools/publish_itch.sh
